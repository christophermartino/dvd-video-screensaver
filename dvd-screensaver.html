<body>
<div id="logo" role="img" aria-label="DVD Video logo bouncing around the screen"></div>
<script>
(() => {
  'use strict';
  const logo = document.getElementById('logo');
  const colors = ['#c4f05b','#ff5eaa','#48e4ff','#fece45','#a28cff','#fc714d','#62ff9d','#ffffff','#6ba8ff'];
  let colorIndex = 0;
  let x = 0, y = 0;
  // Pixels per second, independent of refresh rate.
  let vx = 155, vy = 118;
  let width = 0, height = 0;
  let lastTime = 0;
  let initialized = false;
  function measure() {
    const previousMaxX = Math.max(0, width - logo.offsetWidth);
    const previousMaxY = Math.max(0, height - logo.offsetHeight);
    const ratioX = previousMaxX ? x / previousMaxX : 0.5;
    const ratioY = previousMaxY ? y / previousMaxY : 0.5;
    width = window.innerWidth;
    height = window.innerHeight;
    const maxX = Math.max(0, width - logo.offsetWidth);
    const maxY = Math.max(0, height - logo.offsetHeight);
    if (!initialized) {
      x = maxX / 2;
      y = maxY / 2;
      initialized = true;
    } else {
      x = Math.max(0, Math.min(maxX, ratioX * maxX));
      y = Math.max(0, Math.min(maxY, ratioY * maxY));
    }
    draw();
  }
  function changeColor() {
    // Always choose a different color on a bounce.
    colorIndex = (colorIndex + 1 + Math.floor(Math.random() * (colors.length - 1))) % colors.length;
    logo.style.backgroundColor = colors[colorIndex];
  }
  function draw() { logo.style.transform = `translate3d(${x}px, ${y}px, 0)`; }
  function tick(time) {
    if (!lastTime) lastTime = time;
    const dt = Math.min((time - lastTime) / 1000, 0.05);
    lastTime = time;
    const maxX = Math.max(0, width - logo.offsetWidth);
    const maxY = Math.max(0, height - logo.offsetHeight);
    x += vx * dt;
    y += vy * dt;
    let bounced = false;
    if (x >= maxX) { x = maxX; vx = -Math.abs(vx); bounced = true; }
    else if (x <= 0) { x = 0; vx = Math.abs(vx); bounced = true; }
    if (y >= maxY) { y = maxY; vy = -Math.abs(vy); bounced = true; }
    else if (y <= 0) { y = 0; vy = Math.abs(vy); bounced = true; }
    if (bounced) changeColor();
    draw();
    requestAnimationFrame(tick);
  }
  window.addEventListener('resize', measure);
  document.addEventListener('visibilitychange', () => { lastTime = 0; });
  measure();
  requestAnimationFrame(tick);
})();
</script>
